# Mises à jour de dépendances — https://docs.github.com/code-security/dependabot
#
# C'est la seule source de pull requests du dépôt : le travail courant part d'une branche
# fusionnée en local (voir le README). Ces PR-là existent parce que Dependabot ne sait pas faire
# autrement, et parce que la CI les valide avant qu'on les regarde.
#
# Tout est groupé : à un seul contributeur, dix PR ouvertes en même temps ne se relisent pas.
# Un groupe = une branche = un run de CI.

version: 2

updates:
  - package-ecosystem: npm # couvre pnpm : Dependabot lit pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Laisser passer quelques jours avant de proposer une version : le temps qu'une release
    # cassée soit retirée. Même intention que `minimumReleaseAge` côté pnpm.
    cooldown:
      default-days: 5
    ignore:
      # Ces deux majeures ne se décident pas toutes seules : chacune est arrimée à autre chose
      # que sa propre version, et Dependabot ne voit pas cet arrimage.
      #
      # @types/node doit suivre .nvmrc, pas le dernier Node publié. Proposer la 26 quand on tourne
      # en 24 ferait typer des API absentes à l'exécution : ça compile, puis ça casse.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 compile ce dépôt sans une erreur — vérifié en CI le 7 septembre 2026. Ce qui
      # manque est ailleurs : que l'éditeur compile avec le même binaire que la CI.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Le tout-venant en une PR. Les majors en sortent : elles se lisent une par une.
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: / # les workflows de .github/workflows/ se déclarent depuis la racine
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
