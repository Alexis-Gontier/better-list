name: Notifications Discord

# Toutes les heures, à la 7ᵉ minute : GitHub retarde volontiers les crons posés à l'heure pile, où
# tout le monde les pose. Le plan Vercel Hobby n'autorise qu'un cron quotidien — d'où ce workflow,
# qui ne fait qu'appeler `/api/cron/discord` (voir le commentaire de sa route).
#
# Deux secrets de dépôt à déclarer (Settings → Secrets and variables → Actions) :
#   APP_URL      l'URL publique de production, sans barre finale
#   CRON_SECRET  la même valeur que la variable Vercel
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler la route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # `--fail-with-body` : un 401 ou un 500 fait échouer le run, et GitHub prévient par mail.
        run: |
          curl --silent --show-error --fail-with-body --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/discord"
