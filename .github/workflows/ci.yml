name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push sur une branche annule le run précédent de la même branche : inutile de payer une CI
# pour un commit déjà remplacé.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Types · Tests · Knip · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `pnpm install` déclenche le postinstall `prisma generate`, qui charge prisma.config.ts et
    # y résout `env("DATABASE_URL")` immédiatement. Sans cette variable, l'installation échoue et
    # la CI meurt avant le premier contrôle — ce qu'elle a fait en silence pendant trois merges.
    #
    # L'URL n'est jamais ouverte : `generate` ne fait que lire prisma/schema.prisma. Elle est au
    # niveau du job, et non d'une étape, parce que `install` et `build` en ont besoin tous les deux.
    # À remplacer par une vraie branche Neon éphémère le jour où la CI devra migrer ou requêter.
    # Des valeurs factices, mais valides au regard de src/config/env.ts, plutôt que le
    # SKIP_ENV_VALIDATION qu'on posait avant. Sauter la validation ne fournissait aucune valeur :
    # le build passait la porte pour aller mourir plus loin sur `new URL(undefined)` dans
    # app/layout.tsx. En les déclarant pour de bon, la CI vérifie aussi le schéma lui-même.
    #
    # Rien ici n'est un secret : aucune connexion n'est ouverte, aucune session n'est signée.
    # Les longueurs ne sont là que pour satisfaire les `min(32)` de BETTER_AUTH_SECRET et
    # CRON_SECRET. À remplacer par une branche Neon éphémère le jour où la CI devra requêter.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret-000000
      CRON_SECRET: ci-placeholder-not-a-real-secret-111111
      GITHUB_CLIENT_ID: ci-placeholder
      GITHUB_CLIENT_SECRET: ci-placeholder

    steps:
      - uses: actions/checkout@v7

      # Doit précéder setup-node : c'est lui qui rend `cache: pnpm` possible. La version de pnpm
      # vient du champ `packageManager` de package.json, pas d'un numéro dupliqué ici.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Knip (code et dépendances morts)
        run: pnpm knip

      - name: Build
        run: pnpm build
